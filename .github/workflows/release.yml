name: Release

# 推 v* tag (例如 v0.3.0) 時建置簽章版 APK 並發布到 GitHub Releases。
# 需要在 repo 的 Settings → Secrets and variables → Actions 設定：
#   OPENFX_KEYSTORE_BASE64   keystore 檔案的 base64 (base64 -w0 release.jks)
#   OPENFX_KEYSTORE_PASSWORD keystore 密碼
#   OPENFX_KEY_ALIAS         金鑰別名
#   OPENFX_KEY_PASSWORD      金鑰密碼
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.OPENFX_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::OPENFX_KEYSTORE_BASE64 secret is not set"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "OPENFX_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Build signed APK
        env:
          OPENFX_KEYSTORE_PASSWORD: ${{ secrets.OPENFX_KEYSTORE_PASSWORD }}
          OPENFX_KEY_ALIAS: ${{ secrets.OPENFX_KEY_ALIAS }}
          OPENFX_KEY_PASSWORD: ${{ secrets.OPENFX_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      - name: Verify signature and rename
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK" || { echo "::error::Release APK is unsigned or missing"; ls app/build/outputs/apk/release; exit 1; }
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs "$APK" | head -3
          VERSION=$(grep -m1 'versionName' app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
          mkdir -p dist
          cp "$APK" "dist/OpenFX-$VERSION.apk"
          (cd dist && sha256sum OpenFX-*.apk > SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: openfx-release
          path: dist/

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.apk
            dist/SHA256SUMS
          generate_release_notes: true

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
